<div class="backdrop" *ngIf="visible" (click)="onCancel()">
  <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="actions">
      <button type="button" class="cancel" (click)="onCancel()">{{ cancelLabel }}</button>
      <button type="button" class="confirm" (click)="onConfirm()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
