<div class="header">
    <div class="header-top" style="background-image: url('assets/header-banner/personal_banner.webp')">
        <div>
            <h1><mat-icon>receipt_long</mat-icon>Personal Recipes</h1>
        </div>
    </div>
    <p>These are the recipes you've shared with our community. Take a moment to revisit your favorite culinary creations.</p>
</div>
<div class="container" *ngIf="recipes?.length">
    <li *ngFor="let recipe of recipes">
    <a routerLink="/recipe/{{recipe.id}}">
        <img [src]="recipe.imageUrl" [alt]="recipe.title">
        <div class="tags">
            <p *ngFor="let tag of recipe.tags">
                <mat-icon class="material-symbols-outlined">label</mat-icon>{{ tag }}
            </p>
        </div>
        <div *ngIf="recipe.ratings.length" class="rating">
            <star-rating [starRatings]="recipe.ratings"></star-rating>
            <p> {{ recipe.ratings.length }} {{ recipe.ratings.length === 1 ? 'Rating' : 'Ratings' }} </p>
        </div>
        <h2> {{ recipe.title }}</h2>
    </a></li>
</div>

<app-not-found 
    [visible]="recipes?.length === 0" 
    title="Start sharing your culinary creations!"
    imageUrl="assets/nothing-found/no_personal_recipes.webp"
    buttonLabel="Go to recipes"
    [showArrow]="false">
</app-not-found>
