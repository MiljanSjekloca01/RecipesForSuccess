<div class="header">
    <div class="header-top" style="background-image: url('assets/header-banner/personal_banner.webp')">
        <div>
            <h1><mat-icon>receipt_long</mat-icon>Personal Recipes</h1>
        </div>
    </div>
    <p>These are the recipes you've shared with our community. Take a moment to revisit your favorite culinary creations.</p>
</div>
<app-loading-spinner [visible]="loading"></app-loading-spinner>
<div class="recipes" *ngIf="!loading && recipes?.length">
    <div *ngFor="let recipe of recipes.slice().reverse()" class="container">
        <div class="recipe">
            <a class="recipe-link" routerLink="/recipe/{{recipe.id}}">
                <div class="recipe-part">
                    <img [srcWithFallback]="recipe.imageUrl" [alt]="recipe.title">
                </div>
                <div class="recipe-part">
                    <h3>{{ recipe.title }}</h3>
                </div>
            </a>
            <div class="recipe-part">
                <button type="button" class="edit-recipe" (click)="askToEdit(recipe)" aria-label="Edit recipe">
                    <mat-icon>edit</mat-icon>
                    <span>Edit</span>
                </button>
            </div>
            <div class="recipe-part">
                <button type="button" class="delete-recipe" (click)="askToDelete(recipe)" [disabled]="deletingId === recipe.id" aria-label="Delete recipe">
                    <mat-icon>delete</mat-icon>
                    <span>Delete</span>
                </button>
            </div>
        </div>
    </div>
</div>

<app-edit-recipe-modal
    [recipe]="editingRecipe"
    (saved)="onRecipeSaved($event)"
    (cancel)="cancelEdit()">
</app-edit-recipe-modal>

<app-confirmation-modal
    [visible]="!!pendingRecipe"
    title="Delete recipe"
    [message]="deleteMessage"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
</app-confirmation-modal>

<app-not-found 
    [visible]="!loading && recipes?.length === 0" 
    title="Start sharing your culinary creations!"
    imageUrl="assets/nothing-found/no_personal_recipes.webp"
    buttonLabel="Go to recipes"
    [showArrow]="false">
</app-not-found>
